services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ukiyo_postgres
    environment:
      POSTGRES_USER: ukiyo
      POSTGRES_PASSWORD: ukiyo
      POSTGRES_DB: ukiyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukiyo -d ukiyo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ukiyo_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ukiyo_service
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ukiyo:ukiyo@postgres:5432/ukiyo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
