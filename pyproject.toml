[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ukiyo-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "alembic",
  "asyncpg",
  "pgvector",
  "fastapi-users[sqlalchemy]",
  "httpx",
  "openai",
  "anthropic",
  "google-genai",
  "pydantic-settings",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["backend/ukiyo_service/src"]
include = ["ukiyo_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
